packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true
  lightningcss: true
  sharp: true
  workerd: true
onlyBuiltDependencies:
  - esbuild
  - lightningcss
  - sharp
  - workerd
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vite-plus: 1.6.0
  react: ^19.3.1
  react-dom: ^19.3.1
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  convex: ^1.50.0
  "@convex-dev/auth": ^2.0.0
  typescript: ^6.0.3
  "@types/node": ^22.20.5
  lucide-react: ^0.577.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
minimumReleaseAgeExclude:
  - "@sarant/cloudflare-email-component@0.4.0"
